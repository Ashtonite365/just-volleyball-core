; just volleyball mods (jv-mods) entry point. Lives NEXT TO volleyball.exe.
; Delete this one file to fully uninstall/disable the framework.
; Both sections point at the same bootstrap, which runs only once:
;  - Godot 4.6+ (the game is 4.7.1) honours [autoload_prepend]: runs before the game's autoloads
;  - Godot <=4.5 ignores it and uses the [autoload] entry (runs after them)
; res://mods/... is not in the .pck, so Godot falls back to the real folder
; next to the exe.
[autoload_prepend]
JVModsBootstrap="*res://mods/bootstrap.gd"

[autoload]
JVModsBootstrapLegacy="*res://mods/bootstrap.gd"
